# A safer preset for GSPO stage-2 fine-tuning.
#
# Goals:
# - Reduce RL variance (larger effective batch via grad accumulation).
# - Keep the model anchored (stronger supervised term).
# - Use CER reward for short-utterance stability (WER can be very spiky for 1-3 word refs).
#
# You can still override any field from CLI, e.g.
#   trainer.devices=4 trainer.accumulate_grad_batches=16 model.gspo.group_size=16

defaults:
  - fastconformer_hybrid_tdt_ctc_bpe_gspo_ft
  - _self_

name: "FastConformer-Hybrid-TDT-CTC-BPE-110M-GSPO-FT-STABLE"

model:
  # Slightly smaller LR than the default FT config.
  optim:
    lr: 5e-6

  gspo:
    # Smaller group for speed + lower variance by default.
    group_size: 8

    # CER reward is usually more stable for very short utterances.
    reward:
      components:
        - name: cer
          weight: 1.0
          use_cer: true
          one_minus_error: true

    # Stronger supervised anchor to prevent catastrophic drift.
    sft_weight: 0.2

trainer:
  # Make the effective batch size reasonable even with `model.train_ds.batch_size=1`.
  accumulate_grad_batches: 16

  # Common debug-friendly defaults (override as needed).
  max_steps: 2000
  val_check_interval: 100
  gradient_clip_val: 1.0

