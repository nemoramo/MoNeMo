services:
  nemo-training:
    build:
      context: ..
      dockerfile: Dockerfile.nemo25
    image: nemo-25.11-custom:latest
    runtime: nvidia
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    stdin_open: true
    tty: true
    volumes:
      # 数据目录
      - /data1:/data1
      - /data2:/data2
      - /data3:/data3
      - /mnt/asr-audio-data:/mnt/asr-audio-data
      - ../logs:/workspace/logs

      # RamosNeMo 源码目录 - 使用本地 entrance 脚本
      - ..:/opt/ramosnemo_source

    environment:
      - CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7
      - RAMOSNEMO_SOURCE_DIR=/opt/ramosnemo_source
      - RAMOSNEMO_EXTRAS=asr,audio
      - RAMOSNEMO_DEFAULT_PIP_PACKAGES=boto3[crt] s3fs==0.4.2 tenacity tokenizers>=0.22.0,<=0.23.0 sentencepiece<1.0.0 polars>=1.6.0
      - NEMO_S3_CACHE_DISABLE=${NEMO_S3_CACHE_DISABLE:-1}
      - NEMO_AUDIO_LOCAL_PATH_PREFIX_MAP=${NEMO_AUDIO_LOCAL_PATH_PREFIX_MAP:-tos://=/mnt/}
      - NEMO_S3_DOWNLOAD_LOG_LEVEL=info
      - TOS_ACCESS_KEY_ID=${TOS_ACCESS_KEY_ID:-}
      - TOS_SECRET_ACCESS_KEY=${TOS_SECRET_ACCESS_KEY:-}
      - TOS_REGION=${TOS_REGION:-}
      - TOS_ENDPOINT=${TOS_ENDPOINT:-}
      - TOS_SESSION_TOKEN=${TOS_SESSION_TOKEN:-}
      - TOS_ADDRESSING_STYLE=${TOS_ADDRESSING_STYLE:-virtual}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - AWS_S3_ADDRESSING_STYLE=${AWS_S3_ADDRESSING_STYLE:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      /bin/bash -c "
        echo 'Container started. Available GPUs:' &&
        nvidia-smi &&
        echo '' &&
        /opt/setup_ramosnemo.sh &&
        echo '' &&
        /bin/bash
      "
